---
- name: Install Debian build and runtime packages
  ansible.builtin.apt:
    name: "{{ remoteterminal_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read installed Go version
  ansible.builtin.command:
    argv:
      - /usr/bin/go
      - version
  register: remoteterminal_go_version
  changed_when: false
  when: not ansible_check_mode

- name: Read installed Node.js version
  ansible.builtin.command:
    argv:
      - /usr/bin/node
      - --version
  register: remoteterminal_node_version
  changed_when: false
  when: not ansible_check_mode

- name: Read installed npm version
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - --version
  register: remoteterminal_npm_version
  changed_when: false
  when: not ansible_check_mode

- name: Inventory installed Debian package revisions
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - -W
      - -f=${Package}=${Version}\n
  register: remoteterminal_installed_package_versions
  changed_when: false
  when: not ansible_check_mode

- name: Select exact compiler and build-library package revisions
  ansible.builtin.set_fact:
    remoteterminal_build_tool_package_versions: >-
      {{ remoteterminal_installed_package_versions.stdout_lines |
         select('match',
                ('^(binutils|build-essential|cmake|gcc|golang|libc6-dev|' ~
                 'libjson-c-dev|libpam0g-dev|libssl-dev|libuv1-dev|' ~
                 'libwebsockets-dev|make|nodejs|npm|pkg-config|pkgconf|' ~
                 'zlib1g-dev)[^=]*=')) |
         sort | join('\n') }}
  when: not ansible_check_mode

- name: Verify frontend build toolchain is supported
  ansible.builtin.assert:
    that:
      - (remoteterminal_node_version.stdout | regex_replace('^v', '')).split('.')[0] | int >= 18
      - (remoteterminal_node_version.stdout | regex_replace('^v', '')).split('.')[0] | int < 23
      - remoteterminal_npm_version.stdout.split('.')[0] | int >= 8
    fail_msg: >-
      The React build requires Node.js 18 through 22 and npm 8 or newer. The
      configured Debian repositories installed Node {{ remoteterminal_node_version.stdout }}
      and npm {{ remoteterminal_npm_version.stdout }}.
  when: not ansible_check_mode

- name: Verify Go build toolchain is supported
  ansible.builtin.assert:
    that:
      - >-
        (remoteterminal_go_version.stdout |
         regex_search('go([0-9]+)\.([0-9]+)', '\\1') | first | int) > 1 or
        ((remoteterminal_go_version.stdout |
          regex_search('go([0-9]+)\.([0-9]+)', '\\1') | first | int) == 1 and
         (remoteterminal_go_version.stdout |
          regex_search('go([0-9]+)\.([0-9]+)', '\\2') | first | int) >= 19)
    fail_msg: >-
      The backend requires Go 1.19 or newer. The configured Debian repositories
      installed {{ remoteterminal_go_version.stdout }}.
  when: not ansible_check_mode

- name: Report installed compiler toolchains
  ansible.builtin.debug:
    msg: >-
      Using {{ remoteterminal_go_version.stdout }}, Node
      {{ remoteterminal_node_version.stdout }}, and npm
      {{ remoteterminal_npm_version.stdout }}.
  when: not ansible_check_mode
