---
- name: Manage LinuxCNC Setup SMB mounts
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  pre_tasks:
    - name: Validate the SMB operation and untrusted text fields
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
          - (smb_operation | default("")) in ["apply", "test", "mount", "unmount", "remove"]
          - (target_user | default("")) is match("^[a-zA-Z_][a-zA-Z0-9_.-]*[$]?$")
          - (target_user | default("")) != "root"
          - (smb_server | default("")) is match("^[0-9]{1,3}(?:[.][0-9]{1,3}){3}$")
          - (smb_share | default("")) is match("^[A-Za-z0-9][A-Za-z0-9._$-]{0,79}$")
          - (smb_source | default("")) == "//" ~ smb_server ~ "/" ~ smb_share
          - >-
            smb_operation == "test" or
            (smb_mount_id | default("")) is match("^(?:legacy|[a-f0-9]{16})$")
          - >-
            smb_operation != "apply" or
            (smb_mount_id | default("")) is match("^[a-f0-9]{16}$")
          - >-
            smb_operation == "test" or
            (smb_mount_point | default(""))
            is match("^/(?:mnt|media)(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,79})+$")
          - >-
            ((smb_previous_mount_id | default("")) == "") ==
            ((smb_previous_source | default("")) == "")
          - >-
            ((smb_previous_mount_id | default("")) == "") ==
            ((smb_previous_mount_point | default("")) == "")
          - >-
            (smb_previous_mount_id | default("") == "") or
            smb_operation == "apply"
          - >-
            (smb_previous_mount_id | default("") == "") or
            (smb_previous_mount_id | default(""))
            is match("^(?:legacy|[a-f0-9]{16})$")
          - >-
            (smb_previous_source | default("") == "") or
            (smb_previous_source | default(""))
            is match(
              "^//[0-9]{1,3}(?:[.][0-9]{1,3}){3}/"
              ~ "[A-Za-z0-9][A-Za-z0-9._$-]{0,79}$"
            )
          - >-
            (smb_previous_mount_point | default("") == "") or
            (smb_previous_mount_point | default(""))
            is match("^/(?:mnt|media)(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,79})+$")
        fail_msg: >-
          The SMB request must use a supported operation, a regular non-root
          target user, a validated IPv4 guest share, an owned mount ID, and a
          clean mount directory below /mnt or /media.

    - name: Parse the SMB server IPv4 octets
      ansible.builtin.set_fact:
        smb_server_octets: "{{ smb_server.split('.') | map('int') | list }}"

    - name: Validate the SMB server IPv4 address
      ansible.builtin.assert:
        that:
          - smb_server_octets | length == 4
          - smb_server_octets[0] >= 1
          - smb_server_octets[0] <= 223
          - smb_server_octets[0] != 127
          - smb_server_octets[1] >= 0
          - smb_server_octets[1] <= 255
          - smb_server_octets[2] >= 0
          - smb_server_octets[2] <= 255
          - smb_server_octets[3] >= 0
          - smb_server_octets[3] <= 255
        fail_msg: smb_server must be a usable non-loopback IPv4 address.

    - name: Read the target account
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"

    - name: Read regular-user UID bounds
      ansible.builtin.slurp:
        src: /etc/login.defs
      register: smb_login_defs

    - name: Derive the target account and mount settings
      ansible.builtin.set_fact:
        smb_target_uid: "{{ ansible_facts['getent_passwd'][target_user][1] | int }}"
        smb_target_gid: "{{ ansible_facts['getent_passwd'][target_user][2] | int }}"
        smb_target_home: "{{ ansible_facts['getent_passwd'][target_user][4] }}"
        smb_target_shell: "{{ ansible_facts['getent_passwd'][target_user][5] }}"
        smb_uid_min_matches: >-
          {{
            smb_login_defs.content
            | b64decode
            | regex_findall('(?m)^\s*UID_MIN\s+(\d+)\s*$')
          }}
        smb_uid_max_matches: >-
          {{
            smb_login_defs.content
            | b64decode
            | regex_findall('(?m)^\s*UID_MAX\s+(\d+)\s*$')
          }}
        smb_mount_options: >-
          username=guest,guest,vers=3.0,uid={{ ansible_facts['getent_passwd'][target_user][1] | int }},
          gid={{ ansible_facts['getent_passwd'][target_user][2] | int }},iocharset=utf8,
          file_mode=0644,dir_mode=0755,_netdev,nofail,x-systemd.automount,
          x-systemd.device-timeout=10s,x-systemd.mount-timeout=10s
        smb_marker_label: >-
          {{
            'LINUXCNCSETUP MANAGED SMB SHARE'
            if (smb_mount_id | default('')) == 'legacy'
            else 'LINUXCNCSETUP MANAGED SMB MOUNT ' ~ (smb_mount_id | default(''))
          }}
        smb_previous_marker_label: >-
          {{
            'LINUXCNCSETUP MANAGED SMB SHARE'
            if (smb_previous_mount_id | default('')) == 'legacy'
            else 'LINUXCNCSETUP MANAGED SMB MOUNT ' ~ (smb_previous_mount_id | default(''))
          }}

    - name: Validate the target account
      ansible.builtin.assert:
        that:
          - smb_uid_min_matches | length == 1
          - smb_uid_max_matches | length == 1
          - smb_target_uid >= (smb_uid_min_matches[0] | int)
          - smb_target_uid <= (smb_uid_max_matches[0] | int)
          - smb_target_home is match("^/")
          - not (smb_target_shell is match("^.*/(?:nologin|false)$"))
        fail_msg: >-
          target_user must be a regular login account with an absolute home
          directory and a usable shell.

    - name: Compact the fixed CIFS mount options
      ansible.builtin.set_fact:
        smb_mount_options_compact: "{{ smb_mount_options | regex_replace('\\s+', '') }}"

  tasks:
    - name: Test the requested SMB guest connection
      ansible.builtin.import_tasks: tasks/smb_test.yml
      when: smb_operation == "test"

    - name: Create or update the requested managed SMB mount
      ansible.builtin.import_tasks: tasks/smb_apply.yml
      when: smb_operation == "apply"

    - name: Operate on an existing managed SMB mount
      ansible.builtin.import_tasks: tasks/smb_existing.yml
      when: smb_operation in ["mount", "unmount", "remove"]

  post_tasks:
    - name: Report the SMB operation result
      ansible.builtin.debug:
        msg: >-
          {{
            'Guest access to ' ~ smb_source ~ ' was tested successfully.'
            if smb_operation == 'test'
            else 'The managed SMB mount was saved and mounted.'
            if smb_operation == 'apply'
            else 'The managed SMB mount is active.'
            if smb_operation == 'mount'
            else 'The managed SMB mount is inactive; persistent configuration remains.'
            if smb_operation == 'unmount'
            else 'The managed SMB mount was unmounted and deleted.'
          }}
