---
- name: Read the native Debian package architecture
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg
      - --print-architecture
  register: devtools_warp_native_architecture
  changed_when: false
  check_mode: false

- name: Validate the native Warp package architecture
  ansible.builtin.assert:
    that:
      - devtools_warp_native_architecture.stdout | trim in ["amd64", "arm64"]
    fail_msg: Warp supports only native amd64 and arm64 Debian packages.

- name: Inspect an existing Warp package
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - '--showformat=${Architecture}'
      - warp-terminal
  register: devtools_warp_installed_architecture
  changed_when: false
  failed_when: devtools_warp_installed_architecture.rc not in [0, 1]
  check_mode: false

- name: Reject an existing Warp package for another architecture
  ansible.builtin.assert:
    that:
      - >-
        devtools_warp_installed_architecture.rc != 0 or
        devtools_warp_installed_architecture.stdout | trim ==
        devtools_warp_native_architecture.stdout | trim
    fail_msg: >-
      The installed Warp package architecture does not match this system's
      native Debian architecture.

- name: Create the scoped APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download the Warp repository signing key
  ansible.builtin.get_url:
    url: "{{ devtools_warp_key_url }}"
    dest: "{{ devtools_warp_key_source }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: devtools_warp_key_download

- name: Inspect the Warp repository signing key
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ devtools_warp_key_source }}"
  register: devtools_warp_key_details
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode

- name: Validate the Warp repository signing key fingerprint
  ansible.builtin.assert:
    that:
      - >-
        devtools_warp_key_details.stdout_lines |
        select("match", "^pub:") | list | length == 1
      - >-
        ("fpr:::::::::" + devtools_warp_key_fingerprint + ":") in
        devtools_warp_key_details.stdout
    fail_msg: >-
      The downloaded Warp repository key does not match the pinned official
      signing-key fingerprint.
  when:
    - not ansible_check_mode

- name: Inspect the Warp binary keyring
  ansible.builtin.stat:
    path: "{{ devtools_warp_keyring }}"
  register: devtools_warp_keyring_status

- name: Build the Warp binary keyring
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - "{{ devtools_warp_keyring }}"
      - "{{ devtools_warp_key_source }}"
  become: true
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      devtools_warp_key_download.changed or
      not devtools_warp_keyring_status.stat.exists

- name: Set Warp keyring permissions
  ansible.builtin.file:
    path: "{{ devtools_warp_keyring }}"
    state: file
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - not ansible_check_mode

- name: Configure the Warp stable repository
  ansible.builtin.copy:
    dest: "{{ devtools_warp_repository_file }}"
    content: >-
      deb [arch={{ devtools_warp_native_architecture.stdout | trim }}
      signed-by={{ devtools_warp_keyring }}]
      {{ devtools_warp_repository_url }} stable main
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install Warp Terminal
  ansible.builtin.apt:
    name: warp-terminal
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  become: true
  when:
    - not ansible_check_mode

- name: Preview the Warp Terminal installation in check mode
  ansible.builtin.debug:
    msg: >-
      The signed Warp stable repository and native warp-terminal package would
      be configured.
  changed_when: true
  when: ansible_check_mode
